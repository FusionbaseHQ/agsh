name: Release

# Tag-triggered releases (v*), plus workflow_dispatch to dry-run the whole
# build matrix without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pins, version, tag, and changelog
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "${{ github.event.repository.private }}" != false ]; then
              echo "::error::release tags are refused while the repository is private; public releases require attestations"
              exit 1
            fi
            case "$GITHUB_REF" in
              refs/tags/v*) scripts/validate-release.sh "$GITHUB_REF_NAME" ;;
              *) echo "::error::release pushes must target refs/tags/v*"; exit 1 ;;
            esac
          else
            scripts/validate-release.sh
          fi
          tests/release/run.sh

  # Gate: the tagged commit must pass the workspace tests on both platforms.
  # (Full behavioral suites run in ci.yml on every push to main.)
  test:
    name: test gate (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            installer_fixture: linux-x86_64
          - os: macos-15
            installer_fixture: darwin-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: offline installer fixture (${{ matrix.installer_fixture }})
        run: tests/install/run.sh "${{ matrix.installer_fixture }}"
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          rustup default "$toolchain"
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo build
        run: cargo build --workspace --locked --verbose
      - name: Install x86_64 Rust target for Rosetta compatibility gate
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - name: Rosetta cross-architecture compatibility gate
        if: runner.os == 'macOS'
        run: AGSH_REQUIRE_ROSETTA_CHECK=1 scripts/check-rosetta.sh
      - name: cargo test
        run: cargo test --workspace --locked --verbose
      - name: golden checks
        run: python3 tests/checks/run.py tests/checks/*.agsh
      - name: differential vs bash
        run: python3 tests/differential/diff.py
      - name: POSIX vs sh
        run: python3 tests/differential/posix.py
      - name: interactive (PTY) tests
        run: python3 tests/interactive/run.py

  # Compilation runs without signing or publication credentials. macOS payloads
  # are handed to the isolated signing job as data; Linux archives are final.
  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            intercept_target: aarch64-apple-darwin
            intercept_lib: libagsh_intercept.dylib
            artifact: unsigned-agsh-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-15-intel
            intercept_target: x86_64-apple-darwin
            intercept_lib: libagsh_intercept.dylib
            artifact: unsigned-agsh-x86_64-apple-darwin
          # musl: fully static Linux binaries that run on any distro.
          # The optional preload library uses the host's glibc ABI so it can be
          # injected into ordinary Ubuntu executables.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            intercept_target: x86_64-unknown-linux-gnu
            intercept_lib: libagsh_intercept.so
            artifact: release-agsh-x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04-arm
            intercept_target: aarch64-unknown-linux-gnu
            intercept_lib: libagsh_intercept.so
            artifact: release-agsh-aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and targets
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          rustup target add ${{ matrix.target }}
          if [ "${{ matrix.intercept_target }}" != "${{ matrix.target }}" ]; then
            rustup target add ${{ matrix.intercept_target }}
          fi
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      # x86_64 uses rustc's default self-contained musl link path. Forcing
      # musl-gcc there produces a broken PIE executable (rust-lang/rust#95926).
      - name: Configure native aarch64 musl linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
      - name: Set minimum macOS deployment target
        if: runner.os == 'macOS'
        run: echo 'MACOSX_DEPLOYMENT_TARGET=11.0' >> "$GITHUB_ENV"
      - name: Build shell
        run: cargo build --release --locked -p agsh --target ${{ matrix.target }}
      - name: Build deep-interception library
        run: cargo build --release --locked -p agsh-intercept --target ${{ matrix.intercept_target }}
      - name: Normalize macOS interception-library install name
        if: runner.os == 'macOS'
        run: |
          bin="target/${{ matrix.target }}/release/agsh"
          helper="target/${{ matrix.target }}/release/agsh-exec-helper"
          lib="target/${{ matrix.intercept_target }}/release/${{ matrix.intercept_lib }}"
          install_name_tool -id "@rpath/${{ matrix.intercept_lib }}" "$lib"
          test "$(otool -D "$lib" | tail -n 1)" = "@rpath/${{ matrix.intercept_lib }}"
          test "$(otool -l "$bin" | awk '/minos/{print $2; exit}')" = '11.0'
          test "$(otool -l "$helper" | awk '/minos/{print $2; exit}')" = '11.0'
          test "$(otool -l "$lib" | awk '/minos/{print $2; exit}')" = '11.0'
      - name: Smoke test unsigned build
        run: |
          bin="target/${{ matrix.target }}/release/agsh"
          helper="target/${{ matrix.target }}/release/agsh-exec-helper"
          lib="target/${{ matrix.intercept_target }}/release/${{ matrix.intercept_lib }}"
          test -f "$bin"
          test -f "$helper"
          test -f "$lib"
          if [ "${{ runner.os }}" = Linux ]; then
            for executable in "$bin" "$helper"; do
              program_headers="$RUNNER_TEMP/$(basename "$executable")-program-headers"
              dynamic_entries="$RUNNER_TEMP/$(basename "$executable")-dynamic-entries"
              readelf -lW "$executable" > "$program_headers"
              readelf -dW "$executable" > "$dynamic_entries"
              if grep -q ' INTERP ' "$program_headers"; then
                echo "::error::$executable has a runtime program interpreter"
                exit 1
              fi
              if grep -q '(NEEDED)' "$dynamic_entries"; then
                echo "::error::$executable has a dynamic-library dependency"
                exit 1
              fi
            done
          fi
          expected_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$expected_version"
          case "$(uname -s):$(uname -m):${{ matrix.target }}" in
            Darwin:arm64:aarch64-apple-darwin | Darwin:x86_64:x86_64-apple-darwin | \
            Linux:x86_64:x86_64-unknown-linux-musl | Linux:aarch64:aarch64-unknown-linux-musl)
              test "$("$bin" --version)" = "agsh $expected_version"
              test "$("$helper" --version)" = "agsh-exec-helper $expected_version"
              test "$("$bin" -c 'echo release-smoke')" = "release-smoke"
              test "$("$helper" --internal-exec-helper-v1 -- /bin/sh -c \
                'printf helper-smoke')" = "helper-smoke"
              smoke_src="$RUNNER_TEMP/agsh-dlopen-smoke.c"
              smoke_bin="$RUNNER_TEMP/agsh-dlopen-smoke"
              printf '%s\n' \
                '#include <dlfcn.h>' \
                '#include <stdio.h>' \
                'int main(int argc, char **argv) {' \
                '  void *handle = dlopen(argv[1], RTLD_NOW | RTLD_LOCAL);' \
                '  if (handle == NULL) { puts(dlerror()); return 1; }' \
                '  return dlclose(handle) != 0;' \
                '}' > "$smoke_src"
              cc "$smoke_src" -ldl -o "$smoke_bin"
              "$smoke_bin" "$lib"
              ;;
            *) echo "Cross-built target; existence checked, execution skipped." ;;
          esac
      - name: Smoke test hardened macOS helper boundary
        if: runner.os == 'macOS'
        run: |
          bin="target/${{ matrix.target }}/release/agsh"
          helper="target/${{ matrix.target }}/release/agsh-exec-helper"
          lib="target/${{ matrix.intercept_target }}/release/${{ matrix.intercept_lib }}"
          smoke_dir="$RUNNER_TEMP/agsh-hardened-smoke"
          mkdir "$smoke_dir"
          cp "$bin" "$smoke_dir/agsh"
          cp "$helper" "$smoke_dir/agsh-exec-helper"
          cp "$lib" "$smoke_dir/${{ matrix.intercept_lib }}"
          codesign --force --sign - --options runtime \
            "$smoke_dir/${{ matrix.intercept_lib }}"
          codesign --force --sign - --options runtime \
            "$smoke_dir/agsh-exec-helper"
          codesign --force --sign - --options runtime "$smoke_dir/agsh"

          probe_src="$RUNNER_TEMP/agsh-dyld-environment-smoke.c"
          probe_bin="$RUNNER_TEMP/agsh-dyld-environment-smoke"
          printf '%s\n' \
            '#include <stdio.h>' \
            '#include <stdlib.h>' \
            '#include <string.h>' \
            'extern char **environ;' \
            'int main(void) {' \
            '  const char *prefix = "AGSH_INTERNAL_EXEC_DYLD_V1_";' \
            '  for (char **entry = environ; *entry != NULL; entry++) {' \
            '    if (strncmp(*entry, prefix, strlen(prefix)) == 0) return 3;' \
            '  }' \
            '  const char *insert = getenv("DYLD_INSERT_LIBRARIES");' \
            '  const char *custom = getenv("DYLD_AGSH_TEST");' \
            '  if (insert == NULL || strstr(insert, "libagsh_intercept.dylib") == NULL) return 4;' \
            '  if (custom == NULL || strcmp(custom, "custom") != 0) return 5;' \
            '  puts("hardened-transport-ok");' \
            '  return 0;' \
            '}' > "$probe_src"
          cc "$probe_src" -o "$probe_bin"
          result=$(AGSH_INTERCEPT=semantic:deep "$smoke_dir/agsh" --output raw \
            -c "DYLD_AGSH_TEST=custom '$probe_bin'")
          test "$result" = hardened-transport-ok

          if [ "${{ matrix.target }}" = aarch64-apple-darwin ]; then
            otool -arch arm64e -hv /usr/bin/wc | \
              grep -Eq 'ARM64[[:space:]]+E[[:space:]]+(LIB64|USR00)'
            system_wc_result=$(AGSH_INTERCEPT=semantic:deep "$smoke_dir/agsh" \
              --output raw -c "printf 'system-arm64e-ok\\n' | /usr/bin/wc -l")
            test "$(printf '%s' "$system_wc_result" | tr -d '[:space:]')" = 1

            # The system probe above owns the strict dyld regression. This
            # non-platform fixture verifies exact caller-preload preservation.
            arm64e_caller_src="$RUNNER_TEMP/agsh-arm64e-caller.c"
            arm64e_caller="$RUNNER_TEMP/agsh-arm64e-caller.dylib"
            arm64e_target_src="$RUNNER_TEMP/agsh-arm64e-target.c"
            arm64e_target="$RUNNER_TEMP/agsh-arm64e-target"
            arm64e_marker="$RUNNER_TEMP/agsh-arm64e-caller.marker"
            printf '%s\n' \
              '#include <fcntl.h>' \
              '#include <stdlib.h>' \
              '#include <unistd.h>' \
              '__attribute__((constructor)) static void loaded(void) {' \
              '  const char *marker = getenv("AGSH_CALLER_MARKER");' \
              '  if (marker == NULL) return;' \
              '  int fd = open(marker, O_WRONLY | O_CREAT | O_TRUNC, 0600);' \
              '  if (fd < 0) return;' \
              '  const char value[] = "caller-loaded\\n";' \
              '  (void)write(fd, value, sizeof(value) - 1);' \
              '  (void)close(fd);' \
              '}' > "$arm64e_caller_src"
            printf '%s\n' \
              '#include <stdio.h>' \
              '#include <stdlib.h>' \
              '#include <string.h>' \
              'extern char **environ;' \
              'int main(void) {' \
              '  const char *prefix = "AGSH_INTERNAL_EXEC_DYLD_V1_";' \
              '  for (char **entry = environ; *entry != NULL; entry++) {' \
              '    if (strncmp(*entry, prefix, strlen(prefix)) == 0) return 3;' \
              '  }' \
              '  const char *insert = getenv("DYLD_INSERT_LIBRARIES");' \
              '  const char *expected = getenv("EXPECTED_PRELOAD");' \
              '  if (insert == NULL || expected == NULL || strcmp(insert, expected) != 0) return 4;' \
              '  const char *marker = getenv("AGSH_CALLER_MARKER");' \
              '  if (marker == NULL) return 5;' \
              '  FILE *file = fopen(marker, "r");' \
              '  if (file == NULL) return 6;' \
              '  char value[32] = {0};' \
              '  if (fgets(value, sizeof(value), file) == NULL) return 7;' \
              '  if (fclose(file) != 0 || strcmp(value, "caller-loaded\\n") != 0) return 8;' \
              '  puts("arm64e-preload-ok");' \
              '  return 0;' \
              '}' > "$arm64e_target_src"
            cc -arch arm64e -dynamiclib "$arm64e_caller_src" -o "$arm64e_caller"
            cc -arch arm64e "$arm64e_target_src" -o "$arm64e_target"
            arm64e_source="DYLD_INSERT_LIBRARIES='$smoke_dir/${{ matrix.intercept_lib }}:$arm64e_caller' EXPECTED_PRELOAD='$arm64e_caller' AGSH_CALLER_MARKER='$arm64e_marker' '$arm64e_target'"
            arm64e_result=$(AGSH_INTERCEPT=semantic:deep "$smoke_dir/agsh" \
              --output raw -c "$arm64e_source")
            test "$arm64e_result" = arm64e-preload-ok
            test "$(cat "$arm64e_marker")" = caller-loaded
          fi
      - name: Stage release payload
        id: package
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION=dry-run
          fi
          NAME="agsh-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/agsh" "dist/$NAME/"
          cp "target/${{ matrix.target }}/release/agsh-exec-helper" "dist/$NAME/"
          cp "target/${{ matrix.intercept_target }}/release/${{ matrix.intercept_lib }}" "dist/$NAME/"
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.html README.md CHANGELOG.md "dist/$NAME/"
          rust_copyright="$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html"
          test -f "$rust_copyright"
          cp "$rust_copyright" "dist/$NAME/RUST_STANDARD_LIBRARY_COPYRIGHT.html"
          if [ "${{ runner.os }}" = Linux ]; then
            musl_copyright=/usr/share/doc/musl/copyright
            test -f "$musl_copyright"
            cp "$musl_copyright" "dist/$NAME/MUSL_COPYRIGHT.txt"
          fi
          cp -R LICENSES "dist/$NAME/"
          if [ "${{ runner.os }}" = Linux ]; then
            tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
            rm -r "dist/$NAME"
            (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          fi
          printf 'name=%s\n' "$NAME" >> "$GITHUB_OUTPUT"
      - name: Upload unsigned macOS payload
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ steps.package.outputs.name }}/
          if-no-files-found: error
      - name: Upload final Linux archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ steps.package.outputs.name }}.tar.gz
            dist/${{ steps.package.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  # Source packaging does not compile project or dependency code. The finished
  # artifact is uploaded before a different non-publishing job builds it with
  # network access denied.
  source-package:
    name: assemble corresponding source
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain for cargo vendor
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
      - name: Assemble complete corresponding source
        id: source
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION=dry-run
          fi
          NAME="agsh-$VERSION-source"
          SOURCE_ROOT="$RUNNER_TEMP/corresponding-source"
          mkdir -p "$SOURCE_ROOT/$NAME/.cargo" dist

          git archive --format=tar HEAD | tar -x -C "$SOURCE_ROOT/$NAME"
          (
            cd "$SOURCE_ROOT/$NAME"
            cargo vendor --locked --versioned-dirs vendor > .cargo/config.toml
          )

          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          tar -C "$SOURCE_ROOT" --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 --group=0 --numeric-owner \
            -cf - "$NAME" | gzip -n > "dist/$NAME.tar.gz"
          (cd dist && sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          printf 'name=%s\n' "$NAME" >> "$GITHUB_OUTPUT"
      - name: Upload corresponding source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-agsh-source
          path: |
            dist/${{ steps.source.outputs.name }}.tar.gz
            dist/${{ steps.source.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  source-verify:
    name: build corresponding source offline
    needs: source-package
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Download exact corresponding-source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-agsh-source
          path: incoming
      - name: Verify and build the finished archive
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION=dry-run
          fi
          NAME="agsh-$VERSION-source"
          test "$(find incoming -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find incoming -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
          test -f "incoming/$NAME.tar.gz"
          test -f "incoming/$NAME.tar.gz.sha256"
          (cd incoming && sha256sum -c "$NAME.tar.gz.sha256")

          VERIFY_ROOT="$RUNNER_TEMP/corresponding-source-verify"
          mkdir -p "$VERIFY_ROOT"
          tar -xzf "incoming/$NAME.tar.gz" -C "$VERIFY_ROOT"
          test "$(find "$VERIFY_ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          test "$(find "$VERIFY_ROOT" -mindepth 1 -maxdepth 1 ! -type d | wc -l)" -eq 0
          test -d "$VERIFY_ROOT/$NAME"
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' "$VERIFY_ROOT/$NAME/rust-toolchain.toml")
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal
          rustup default "$toolchain"
          (
            cd "$VERIFY_ROOT/$NAME"
            # Bypass rustup proxies inside the offline namespace. The project
            # toolchain file requests development components that the minimal
            # verifier install intentionally does not need.
            cargo_bin=$(rustup which --toolchain "$toolchain" cargo)
            rustc_bin=$(rustup which --toolchain "$toolchain" rustc)
            toolchain_bin=${cargo_bin%/*}
            test -x "$cargo_bin"
            test -x "$rustc_bin"
            test "${rustc_bin%/*}" = "$toolchain_bin"
            unshare_bin=$(command -v unshare)
            setpriv_bin=$(command -v setpriv)
            runner_uid=$(id -u)
            runner_gid=$(id -g)
            sudo --non-interactive "$unshare_bin" --net -- "$setpriv_bin" \
              --reuid "$runner_uid" --regid "$runner_gid" --init-groups \
              --no-new-privs -- \
              /usr/bin/env \
              "HOME=$HOME" \
              "PATH=$toolchain_bin:$PATH" \
              "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
              "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
              "RUSTC=$rustc_bin" \
              "RUSTUP_TOOLCHAIN=$toolchain" \
              RUSTUP_AUTO_INSTALL=0 \
              CARGO_NET_OFFLINE=true \
              "CARGO_TARGET_DIR=$RUNNER_TEMP/corresponding-source-target" \
              "$cargo_bin" build --workspace --release --locked --offline
          )

  # Release notes and the installer are copied without running repository code.
  metadata:
    name: prepare release metadata
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare installer and release notes
        run: |
          mkdir metadata
          cp install.sh metadata/install.sh
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            ver=${GITHUB_REF_NAME#v}
          else
            ver=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          fi
          awk -v ver="$ver" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > metadata/notes.md
          if ! grep -q '[^[:space:]]' metadata/notes.md; then
            echo "See CHANGELOG.md for details." > metadata/notes.md
          fi
      - name: Upload exact release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: |
            metadata/install.sh
            metadata/notes.md
          if-no-files-found: error

  # This job never checks out or compiles repository code and never executes the
  # downloaded payload. Its environment must be protected as documented.
  sign-macos:
    name: sign (${{ matrix.target }})
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    environment:
      name: release-signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            arch: arm64
            artifact: unsigned-agsh-aarch64-apple-darwin
          - target: x86_64-apple-darwin
            os: macos-15-intel
            arch: x86_64
            artifact: unsigned-agsh-x86_64-apple-darwin
    steps:
      - name: Download exact unsigned payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: unsigned
      - name: Validate unsigned payload
        run: |
          test "$(find unsigned -mindepth 1 -type f | wc -l)" -eq 10
          test "$(find unsigned -mindepth 1 -type d | wc -l)" -eq 1
          test "$(find unsigned -mindepth 1 ! -type f ! -type d | wc -l)" -eq 0
          set -- \
            unsigned/agsh \
            unsigned/agsh-exec-helper \
            unsigned/libagsh_intercept.dylib \
            unsigned/LICENSE \
            unsigned/NOTICE \
            unsigned/THIRD_PARTY_LICENSES.html \
            unsigned/RUST_STANDARD_LIBRARY_COPYRIGHT.html \
            unsigned/README.md \
            unsigned/CHANGELOG.md \
            unsigned/LICENSES/Apache-2.0.txt
          for file in "$@"; do
            test -f "$file"
            test ! -L "$file"
          done
          test -d unsigned/LICENSES
          test ! -L unsigned/LICENSES
          test "$(lipo -archs unsigned/agsh)" = "${{ matrix.arch }}"
          test "$(lipo -archs unsigned/agsh-exec-helper)" = "${{ matrix.arch }}"
          test "$(lipo -archs unsigned/libagsh_intercept.dylib)" = "${{ matrix.arch }}"
          chmod 755 unsigned/agsh unsigned/agsh-exec-helper \
            unsigned/libagsh_intercept.dylib
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          umask 077
          test -n "$MACOS_CERT_P12"
          test -n "$MACOS_CERT_PASSWORD"
          test -n "$MACOS_SIGN_IDENTITY"
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 24)
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT
          printf '%s' "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
      - name: Sign with hardened runtime and notarize
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          umask 077
          bin=unsigned/agsh
          helper=unsigned/agsh-exec-helper
          lib=unsigned/libagsh_intercept.dylib
          trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT
          codesign --force --sign "$MACOS_SIGN_IDENTITY" \
            --options runtime --timestamp "$lib"
          codesign --force --sign "$MACOS_SIGN_IDENTITY" \
            --options runtime --timestamp "$helper"
          codesign --force --sign "$MACOS_SIGN_IDENTITY" \
            --options runtime --timestamp "$bin"
          codesign --verify --strict --verbose=2 "$lib"
          codesign --verify --strict --verbose=2 "$helper"
          codesign --verify --strict --verbose=2 "$bin"

          if [ -n "$APPLE_API_KEY_P8" ]; then
            test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER" || {
              echo "::error::API-key notarization requires APPLE_API_KEY_ID and APPLE_API_ISSUER"
              exit 1
            }
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            auth=(--key "$RUNNER_TEMP/AuthKey.p8"
                  --key-id "$APPLE_API_KEY_ID"
                  --issuer "$APPLE_API_ISSUER")
          elif [ -n "$APPLE_APP_PASSWORD" ]; then
            test -n "$APPLE_ID" && test -n "$APPLE_TEAM_ID" || {
              echo "::error::Apple-ID notarization requires APPLE_ID and APPLE_TEAM_ID"
              exit 1
            }
            auth=(--apple-id "$APPLE_ID"
                  --team-id "$APPLE_TEAM_ID"
                  --password "$APPLE_APP_PASSWORD")
          else
            echo "::error::no notary credentials configured in release-signing"
            exit 1
          fi

          notarize_dir="$RUNNER_TEMP/agsh-notarize"
          mkdir "$notarize_dir"
          cp "$bin" "$helper" "$lib" "$notarize_dir/"
          ditto -c -k --keepParent "$notarize_dir" "$RUNNER_TEMP/agsh-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/agsh-notarize.zip" \
            "${auth[@]}" \
            --wait --timeout 20m \
            --output-format json | tee "$RUNNER_TEMP/notary.json"
          status=$(jq -r '.status' "$RUNNER_TEMP/notary.json")
          if [ "$status" != Accepted ]; then
            echo "::error::notarization failed: status=$status (id=$(jq -r '.id' "$RUNNER_TEMP/notary.json"))"
            exit 1
          fi
      - name: Clean up signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/sign.keychain-db" 2>/dev/null || true
          security list-keychains -d user -s login.keychain-db 2>/dev/null || true
      - name: Package signed payload
        id: signed
        run: |
          NAME="agsh-$GITHUB_REF_NAME-${{ matrix.target }}"
          mkdir -p "package/$NAME" dist
          cp -R unsigned/. "package/$NAME/"
          chmod 755 "package/$NAME/agsh" \
            "package/$NAME/agsh-exec-helper" \
            "package/$NAME/libagsh_intercept.dylib"
          tar -C package -czf "dist/$NAME.tar.gz" "$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
          printf 'name=%s\n' "$NAME" >> "$GITHUB_OUTPUT"
      - name: Upload final signed archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-agsh-${{ matrix.target }}
          path: |
            dist/${{ steps.signed.outputs.name }}.tar.gz
            dist/${{ steps.signed.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  # The publisher has no checkout and runs no Cargo/project code. It receives
  # only exact final artifacts after all non-publishing verification has passed.
  release:
    name: publish GitHub release
    needs: [build, source-package, source-verify, metadata, sign-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    environment:
      name: release-publication
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download final macOS arm64 archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-agsh-aarch64-apple-darwin
          path: incoming/aarch64-apple-darwin
      - name: Download final macOS x86_64 archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-agsh-x86_64-apple-darwin
          path: incoming/x86_64-apple-darwin
      - name: Download final Linux arm64 archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-agsh-aarch64-unknown-linux-musl
          path: incoming/aarch64-unknown-linux-musl
      - name: Download final Linux x86_64 archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-agsh-x86_64-unknown-linux-musl
          path: incoming/x86_64-unknown-linux-musl
      - name: Download exact corresponding-source archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-agsh-source
          path: incoming/source
      - name: Download exact release metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: incoming/metadata
      - name: Assemble and verify exact release asset set
        run: |
          set -euo pipefail
          mkdir dist
          targets=(
            aarch64-apple-darwin
            x86_64-apple-darwin
            aarch64-unknown-linux-musl
            x86_64-unknown-linux-musl
          )
          archives=()
          for target in "${targets[@]}"; do
            input="incoming/$target"
            archive="agsh-$GITHUB_REF_NAME-$target.tar.gz"
            test "$(find "$input" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
            test "$(find "$input" -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
            test -f "$input/$archive"
            test -f "$input/$archive.sha256"
            cp "$input/$archive" "$input/$archive.sha256" dist/
            archives+=("$archive")
          done

          source_archive="agsh-$GITHUB_REF_NAME-source.tar.gz"
          test "$(find incoming/source -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find incoming/source -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
          test -f "incoming/source/$source_archive"
          test -f "incoming/source/$source_archive.sha256"
          cp "incoming/source/$source_archive" "incoming/source/$source_archive.sha256" dist/
          archives+=("$source_archive")

          test "$(find incoming/metadata -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2
          test "$(find incoming/metadata -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
          test -f incoming/metadata/install.sh
          test -f incoming/metadata/notes.md
          test -s incoming/metadata/notes.md
          cp incoming/metadata/install.sh dist/install.sh

          cd dist
          : > checksums.unsorted
          for archive in "${archives[@]}"; do
            sidecar="$archive.sha256"
            expected=$(awk -v file="$archive" '
              NR == 1 && NF == 2 && $2 == file && length($1) == 64 && $1 ~ /^[0-9a-f]+$/ { print $1 }
            ' "$sidecar")
            test "$(wc -l < "$sidecar" | tr -d ' ')" = 1
            test -n "$expected"
            actual=$(sha256sum "$archive" | awk '{print $1}')
            test "$actual" = "$expected"
            sha256sum "$archive" >> checksums.unsorted
          done
          sha256sum install.sh >> checksums.unsorted
          LC_ALL=C sort -k 2 checksums.unsorted > checksums.txt
          sha256sum -c checksums.txt
          for archive in "${archives[@]}"; do
            rm "$archive.sha256"
          done
          rm checksums.unsorted

          expected_assets=(
            "agsh-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz"
            "agsh-$GITHUB_REF_NAME-x86_64-apple-darwin.tar.gz"
            "agsh-$GITHUB_REF_NAME-aarch64-unknown-linux-musl.tar.gz"
            "agsh-$GITHUB_REF_NAME-x86_64-unknown-linux-musl.tar.gz"
            "agsh-$GITHUB_REF_NAME-source.tar.gz"
            install.sh
            checksums.txt
          )
          test "$(find . -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq "${#expected_assets[@]}"
          test "$(find . -mindepth 1 -maxdepth 1 ! -type f | wc -l)" -eq 0
          for asset in "${expected_assets[@]}"; do
            test -f "$asset"
          done
      - name: Prepare no-checkout release-tag guard
        run: |
          umask 077
          cat > "$RUNNER_TEMP/verify-release-tag-binding.sh" <<'BASH'
          verify_release_tag_binding() {
            local ref_type tag_object_sha target_type target_sha
            local confirmed_ref_type confirmed_tag_object_sha
            IFS=$'\t' read -r ref_type tag_object_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            if [ "$ref_type" != tag ]; then
              echo "::error::$GITHUB_REF_NAME is no longer an annotated tag"
              return 1
            fi

            IFS=$'\t' read -r target_type target_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            if [ "$target_type" != commit ]; then
              echo "::error::$GITHUB_REF_NAME must directly annotate a commit"
              return 1
            fi

            IFS=$'\t' read -r confirmed_ref_type confirmed_tag_object_sha < <(
              gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
            if [ "$confirmed_ref_type" != tag ] || \
              [ "$confirmed_tag_object_sha" != "$tag_object_sha" ]
            then
              echo "::error::$GITHUB_REF_NAME changed while its target was being checked"
              return 1
            fi
            if ! test "$target_sha" = "$GITHUB_SHA"; then
              echo "::error::$GITHUB_REF_NAME moved from workflow commit $GITHUB_SHA to $target_sha"
              return 1
            fi
          }
          BASH
      - name: Revalidate annotated tag before attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/verify-release-tag-binding.sh"
          verify_release_tag_binding
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/agsh-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz
            dist/agsh-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz
            dist/agsh-${{ github.ref_name }}-aarch64-unknown-linux-musl.tar.gz
            dist/agsh-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz
            dist/agsh-${{ github.ref_name }}-source.tar.gz
            dist/install.sh
            dist/checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/verify-release-tag-binding.sh"
          verify_release_tag_binding
          gh release create "$GITHUB_REF_NAME" \
            "dist/agsh-$GITHUB_REF_NAME-aarch64-apple-darwin.tar.gz" \
            "dist/agsh-$GITHUB_REF_NAME-x86_64-apple-darwin.tar.gz" \
            "dist/agsh-$GITHUB_REF_NAME-aarch64-unknown-linux-musl.tar.gz" \
            "dist/agsh-$GITHUB_REF_NAME-x86_64-unknown-linux-musl.tar.gz" \
            "dist/agsh-$GITHUB_REF_NAME-source.tar.gz" \
            dist/install.sh \
            dist/checksums.txt \
            --title "agsh $GITHUB_REF_NAME" \
            --notes-file incoming/metadata/notes.md \
            --verify-tag
          immutable=$(gh release view "$GITHUB_REF_NAME" --json isImmutable --jq .isImmutable)
          if [ "$immutable" != true ]; then
            echo "::error::published release is mutable; enable repository release immutability"
            exit 1
          fi
