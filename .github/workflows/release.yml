name: Release

# Tag-triggered releases (v*), plus workflow_dispatch to dry-run the whole
# build matrix without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # create the release + upload assets

jobs:
  # Gate: the tagged commit must pass the workspace tests on both platforms.
  # (Full behavioral suites run in ci.yml on every push to main.)
  test:
    name: test gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --locked

  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # musl: fully static Linux binaries that run on any distro.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable + target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CARGO_TARGET_$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p agsh --target ${{ matrix.target }}

      # ---- macOS: Developer ID signing + notarization --------------------
      # Required for tagged releases (a tag build FAILS without the secrets,
      # so an unsigned release can never slip out); dry runs skip gracefully.
      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            case "$GITHUB_REF" in
            refs/tags/v*)
              echo "::error::tagged release requires signing secrets: MACOS_CERT_P12, MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY, plus notary credentials (either APPLE_API_KEY_ID/APPLE_API_ISSUER/APPLE_API_KEY_P8 or APPLE_ID/APPLE_TEAM_ID/APPLE_APP_PASSWORD) — see docs/RELEASING.md"
              exit 1
              ;;
            *)
              echo "No signing secrets available — dry-run build stays unsigned."
              exit 0
              ;;
            esac
          fi
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 24)
          echo "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 1800 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          echo "SIGNING=1" >>"$GITHUB_ENV"

      - name: Sign (hardened runtime) and notarize
        if: runner.os == 'macOS' && env.SIGNING == '1'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          # Notary auth, option A: App Store Connect API key.
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          # Notary auth, option B: Apple ID + app-specific password.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          bin="target/${{ matrix.target }}/release/agsh"
          codesign --force --sign "$MACOS_SIGN_IDENTITY" \
            --options runtime --timestamp "$bin"
          codesign --verify --strict --verbose=2 "$bin"

          # Pick notary credentials: API key if present, else Apple ID +
          # app-specific password.
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            auth=(--key "$RUNNER_TEMP/AuthKey.p8"
                  --key-id "$APPLE_API_KEY_ID"
                  --issuer "$APPLE_API_ISSUER")
          elif [ -n "$APPLE_APP_PASSWORD" ]; then
            auth=(--apple-id "$APPLE_ID"
                  --team-id "$APPLE_TEAM_ID"
                  --password "$APPLE_APP_PASSWORD")
          else
            echo "::error::no notary credentials: set APPLE_API_KEY_ID/APPLE_API_ISSUER/APPLE_API_KEY_P8 or APPLE_ID/APPLE_TEAM_ID/APPLE_APP_PASSWORD"
            exit 1
          fi

          # The notary service accepts zip/dmg/pkg — submit a zip of the
          # signed binary. The ticket is keyed to the binary's cdhash, so the
          # binary inside our .tar.gz is covered; bare Mach-O binaries can't
          # be stapled (Gatekeeper fetches the ticket online on first run).
          ditto -c -k "$bin" "$RUNNER_TEMP/agsh-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/agsh-notarize.zip" \
            "${auth[@]}" \
            --wait --timeout 20m \
            --output-format json | tee "$RUNNER_TEMP/notary.json"
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          status=$(jq -r '.status' "$RUNNER_TEMP/notary.json")
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarization failed: status=$status (id=$(jq -r '.id' "$RUNNER_TEMP/notary.json"))"
            exit 1
          fi

      - name: Clean up signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/sign.keychain-db" 2>/dev/null || true
          security list-keychains -d user -s login.keychain-db 2>/dev/null || true
      # ---------------------------------------------------------------------

      - name: Smoke test the binary
        # Native-arch targets only; the x86_64 darwin binary is cross-built on
        # an arm64 runner (Rosetta may or may not be available — skip there).
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          bin="target/${{ matrix.target }}/release/agsh"
          "$bin" --version
          test "$("$bin" -c 'echo release-smoke')" = "release-smoke"
      - name: Package
        run: |
          VERSION="$GITHUB_REF_NAME"
          case "$VERSION" in v*) ;; *) VERSION="dry-run" ;; esac
          NAME="agsh-$VERSION-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/agsh" "dist/$NAME/"
          cp LICENSE README.md CHANGELOG.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          rm -r "dist/$NAME"
          (cd dist && shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: agsh-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Assemble checksums.txt
        run: |
          cd dist
          cat ./*.sha256 > checksums.txt
          rm ./*.sha256
          ls -la
      - name: Extract this version's notes from CHANGELOG.md
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "See CHANGELOG.md for details." > notes.md
          fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "agsh $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
