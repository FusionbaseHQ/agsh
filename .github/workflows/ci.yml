name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting + lints are fast and platform-independent: run once.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable + rustfmt + clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Build + the full test matrix on both supported platforms.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --workspace --locked --verbose
      - name: cargo test
        run: cargo test --workspace --locked --verbose
      - name: golden checks
        run: python3 tests/checks/run.py tests/checks/*.agsh
      - name: differential vs bash
        run: python3 tests/differential/diff.py
      - name: POSIX vs sh
        run: python3 tests/differential/posix.py
      - name: interactive (PTY) tests
        run: python3 tests/interactive/run.py
