[shell]
default_mode = "native"
posix_compat = true
startup_budget_ms = 5

[compat]
external_coreutils_by_default = true
accelerated_coreutils = false
path_cache = true

[env]
path_as_list = true
load_dotenv = false

[output]
human_default = "raw"
agent_default = "semantic"
ci_default = "raw"
store_raw = true

[security]
project_config_requires_trust = true
agent_default_policy = "agent.workspace"
