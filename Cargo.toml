[workspace]
resolver = "2"
members = [
  "crates/agsh",
  "crates/agsh-broker",
  "crates/agsh-core",
  "crates/agsh-exec",
  "crates/agsh-policy",
  "crates/agsh-output",
  "crates/agsh-agent",
  "crates/agsh-tty",
  "crates/agsh-store",
  "crates/agsh-index",
  "crates/agsh-compat",
  "crates/agsh-style",
  "crates/agsh-render",
  "crates/agsh-intercept",
]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "AGPL-3.0-only"
version = "0.2.0"
authors = ["Fusionbase and the agsh contributors"]
description = "A modern, from-scratch POSIX-style shell in Rust — for humans and AI coding agents."
repository = "https://github.com/FusionbaseHQ/agsh"
homepage = "https://github.com/FusionbaseHQ/agsh"
keywords = ["shell", "posix", "terminal", "agent", "sandbox"]
categories = ["command-line-utilities", "development-tools"]

[workspace.lints.rust]
unsafe_code = "forbid"


[profile.release]
strip = "symbols"
lto = "thin"
