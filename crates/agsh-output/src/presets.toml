max_lines = 60

[[compactor]]
name = "turbo"
match.argv = ["turbo", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^\s*cache (hit|miss|bypass)', '^\s*\d+ packages in scope', '^\s*Tasks:\s+\d+', '^\s*Duration:\s+', '^\s*Remote caching (enabled|disabled)']
truncate_lines_at = 150
max_lines = 50
on_empty = "turbo: ok"

[[compactor]]
name = "task"
match.argv = ["task", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^task: \[.*\] ', '^task: Task .* is up to date']
truncate_lines_at = 150
max_lines = 50
on_empty = "task: ok"

[[compactor]]
name = "just"
match.argv = ["just", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^\s*Available recipes:', '^\s*just --list']
truncate_lines_at = 150
max_lines = 50

[[compactor]]
name = "mise"
match.argv = ["mise", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^mise\s+(trust|install|upgrade).*✓', '^mise\s+Installing\s', '^mise\s+Downloading\s', '^mise\s+Extracting\s', '^mise\s+\w+@[\d.]+ installed']
truncate_lines_at = 150
max_lines = 50
on_empty = "mise: ok"

# ---- package / dependency installers (non-family) ----------------------------

[[compactor]]
name = "brew-install"
match.argv = ["brew", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^==> Downloading', '^==> Pouring', '^Already downloaded:', '^###', '^==> Fetching']
match_output = [{ pattern = 'already installed', message = 'ok (already installed)' }]
max_lines = 20

[[compactor]]
name = "bundle-install"
match.argv = ["bundle", "*"]
strip_ansi = true
strip_lines = ['^Using ', '^\s*$', '^Fetching gem metadata', '^Resolving dependencies']
match_output = [
  { pattern = 'Bundle complete!', message = 'ok bundle: complete' },
  { pattern = 'Bundle updated!', message = 'ok bundle: updated' },
]
max_lines = 30

[[compactor]]
name = "composer-install"
match.argv = ["composer", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^  - Downloading ', '^  - Installing ', '^Loading composer', '^Updating dependencies']
match_output = [{ pattern = 'Nothing to install, update or remove', message = 'ok (up to date)' }]
max_lines = 30

[[compactor]]
name = "poetry-install"
match.argv = ["poetry", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^  [-•] Downloading ', '^  [-•] Installing .* \(', '^Creating virtualenv', '^Using virtualenv']
match_output = [{ pattern = 'No dependencies to install or update|No changes\.', message = 'ok (up to date)' }]
max_lines = 30

[[compactor]]
name = "uv-sync"
match.argv = ["uv", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^\s+Downloading ', '^\s+Using cached ', '^\s+Preparing ']
match_output = [{ pattern = 'Audited \d+ package', message = 'ok (up to date)' }]
max_lines = 20

