[[compactor]]
name = "pulumi-stack"
match.argv = ["pulumi", "stack", "*"]
strip_ansi = true
match_output = [{ pattern = 'No stacks found', message = 'pulumi stack: empty' }]
strip_lines = ['^\s*$', '^Please choose a stack', '^More information at:', '^Use `pulumi ']
on_empty = "pulumi stack: ok"

[[compactor]]
name = "ansible-playbook"
match.argv = ["ansible-playbook", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^ok: \[', '^skipping: \[']
max_lines = 60

# ---- cloud / containers (non-family) -----------------------------------------

[[compactor]]
name = "gcloud"
match.argv = ["gcloud", "*"]
strip_ansi = true
strip_lines = ['^\s*$']
truncate_lines_at = 120
max_lines = 30

[[compactor]]
name = "skopeo"
match.argv = ["skopeo", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^Getting image source signatures', '^Copying blob', '^Copying config', '^Writing manifest', '^Storing signatures']
truncate_lines_at = 120
max_lines = 30
on_empty = "skopeo: ok"

# ---- database / migrations ---------------------------------------------------

[[compactor]]
name = "liquibase"
match.argv = ["liquibase", "*"]
strip_ansi = true
filter_stderr = true
strip_lines = [
  '^\s*$', '^Starting Liquibase at', '^Liquibase (?:Community|Open Source)', '^Liquibase Home:',
  '^Java Home', '^Libraries:', '^\s*-\s+\S+\.jar', '^INFO \[liquibase\.integration\]',
  '^INFO \[liquibase\.core\] Reading resource', '^INFO \[liquibase\.core\] Parsing',
  '^(?:\[?INFO\]?\s*)?#+$', '^\s*##',
]
max_lines = 200
on_empty = "liquibase: ok"

# ---- build tools / task runners (non-family) ---------------------------------

[[compactor]]
name = "dotnet-build"
match.argv = ["dotnet", "build", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^Microsoft \(R\)', '^Copyright \(C\)', '^  Determining projects']
match_output = [{ pattern = '0 Warning\(s\)\n\s+0 Error\(s\)', message = 'ok (build succeeded)' }]
max_lines = 40

[[compactor]]
name = "swift-build"
match.argv = ["swift", "build", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^Compiling ', '^Linking ']
match_output = [{ pattern = 'Build complete!', message = 'ok (build complete)', unless = 'warning:|error:' }]
max_lines = 40

[[compactor]]
name = "xcodebuild"
match.argv = ["xcodebuild", "*"]
strip_ansi = true
strip_lines = [
  '^\s*$', '^CompileC\s', '^CompileSwift\s', '^Ld\s', '^CreateBuildDirectory\s', '^MkDir\s',
  '^ProcessInfoPlistFile\s', '^CopySwiftLibs\s', '^CodeSign\s', '^Signing Identity:', '^RegisterWithLaunchServices',
  '^Validate\s', '^ProcessProductPackaging', '^Touch\s', '^CompileStoryboard', '^CompileAssetCatalog',
  '^GenerateDSYMFile', '^PhaseScriptExecution', '^PBXCp\s', '^\s+cd\s+/', '^\s+export\s',
  '^\s+/usr/bin/', '^\s+builtin-', '^note: Using new build system',
]
max_lines = 60
on_empty = "xcodebuild: ok"

[[compactor]]
name = "mix-compile"
match.argv = ["mix", "compile", "*"]
strip_ansi = true
strip_lines = ['^Compiling \d+ file', '^\s*$', '^Generated\s']
max_lines = 40
on_empty = "mix compile: ok"

[[compactor]]
name = "mix-format"
match.argv = ["mix", "format", "*"]
max_lines = 20
on_empty = "mix format: ok"

[[compactor]]
name = "pio-run"
match.argv = ["pio", "run", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^Verbose mode', '^CONFIGURATION:', '^LDF:', '^Library Manager:', '^Compiling\s', '^Linking\s', '^Building\s', '^Checking size']
max_lines = 30
on_empty = "pio run: ok"

[[compactor]]
name = "quarto-render"
match.argv = ["quarto", "render", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^\s*processing file:', '^\s*\d+/\d+\s', '^\s*running', '^\s*Rendering', '^pandoc ', '^  Validating', '^  Resolving']
match_output = [{ pattern = 'Output created:', message = 'ok (output created)' }]
max_lines = 20

[[compactor]]
name = "trunk-build"
match.argv = ["trunk", "build", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^\s*Compiling\s', '^\s*Downloading\s', '^\s*Fetching\s', '^\s*Fresh\s', '^\s*Checking\s']
