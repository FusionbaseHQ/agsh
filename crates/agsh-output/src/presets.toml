max_lines = 30
on_empty = "trunk build: ok"

[[compactor]]
name = "nx"
match.argv = ["nx", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^\s*>\s*NX\s+Running target', '^\s*>\s*NX\s+Nx read the output', '^\s*>\s*NX\s+View logs', '^———————', '^—————————', '^\s+Nx \(powered by']
