# Built-in command compactor presets, translated from rtk's src/filters/*.toml
# (the "Rust Token Killer"). Merged at a low priority by
# CompactorConfig::merge_builtin_presets, so any user/project [[compactor]]
# overrides them. These cover the long tail of commands that agsh has no
# dedicated family compactor for; the high-frequency families (git, test
# runners, compilers/linters, grep/rg, package managers, docker/k8s) keep their
# richer native SemanticSummary compactors and are intentionally not listed here.
#
# Regexes use TOML literal (single-quoted) strings so backslashes are verbatim.

# ---- system / disk / process -------------------------------------------------

[[compactor]]
name = "df"
match.argv = ["df", "*"]
strip_ansi = true
truncate_lines_at = 80
max_lines = 20

[[compactor]]
name = "du"
match.argv = ["du", "*"]
strip_lines = ['^\s*$']
truncate_lines_at = 120
max_lines = 40

[[compactor]]
name = "ps"
match.argv = ["ps", "*"]
strip_ansi = true
truncate_lines_at = 120
max_lines = 30

[[compactor]]
name = "stat"
match.argv = ["stat", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^\s*Device:', '^\s*Birth:']
truncate_lines_at = 120
max_lines = 20

[[compactor]]
name = "systemctl-status"
match.argv = ["systemctl", "status", "*"]
strip_ansi = true
strip_lines = ['^\s*$']
max_lines = 20

[[compactor]]
name = "iptables"
match.argv = ["iptables", "*"]
strip_lines = ['^\s*$', '^Chain DOCKER', '^Chain BR-']
truncate_lines_at = 120
max_lines = 50

[[compactor]]
name = "fail2ban-client"
match.argv = ["fail2ban-client", "*"]
strip_lines = ['^\s*$']
max_lines = 30

# ---- network -----------------------------------------------------------------

[[compactor]]
name = "ssh"
match.argv = ["ssh", "*"]
strip_ansi = true
strip_lines = [
  '^\s*$',
  '^Warning: Permanently added',
  '^Connection to .+ closed',
  '^Authenticated to',
  '^debug1:',
  '^OpenSSH_',
  '^Pseudo-terminal',
]
truncate_lines_at = 120
max_lines = 200

[[compactor]]
name = "ping"
match.argv = ["ping", "*"]
strip_ansi = true
strip_lines = ['^PING ', '^Pinging ', '^\d+ bytes from ', '^Reply from .+: bytes=', '^\s*$']
tail_lines = 4

[[compactor]]
name = "rsync"
match.argv = ["rsync", "*"]
strip_ansi = true
strip_lines = ['^\s*$', '^sending incremental file list', '^sent \d']
match_output = [{ pattern = 'total size is', message = 'ok (synced)', unless = 'error|failed|No such file' }]
max_lines = 20

[[compactor]]
name = "curl-verbose"
match.argv = ["curl", "-v", "*"]
strip_ansi = true
strip_lines = ['^\*\s', '^> ', '^< ', '^\s*%\s+Total', '^\s*$']
max_lines = 40

# ---- infrastructure as code --------------------------------------------------

[[compactor]]
name = "terraform-plan"
match.argv = ["terraform", "plan", "*"]
strip_ansi = true
strip_lines = ['^Refreshing state', '^\s*#.*unchanged', '^\s*$', '^Acquiring state lock', '^Releasing state lock']
max_lines = 80
on_empty = "terraform plan: no changes detected"

[[compactor]]
name = "tofu-plan"
match.argv = ["tofu", "plan", "*"]
strip_ansi = true
strip_lines = ['^Refreshing state', '^\s*#.*unchanged', '^\s*$', '^Acquiring state lock', '^Releasing state lock']
max_lines = 80
on_empty = "tofu plan: no changes detected"

[[compactor]]
name = "tofu-init"
match.argv = ["tofu", "init", "*"]
strip_ansi = true
strip_lines = [
  '^- Downloading', '^- Installing', '^- Using previously-installed', '^\s*$',
  '^Initializing provider', '^Initializing the backend', '^Initializing modules',
]
max_lines = 20
on_empty = "tofu init: ok"

[[compactor]]
name = "tofu-fmt"
match.argv = ["tofu", "fmt", "*"]
strip_ansi = true
max_lines = 30
on_empty = "tofu fmt: ok (no changes)"

[[compactor]]
name = "tofu-validate"
match.argv = ["tofu", "validate", "*"]
strip_ansi = true
match_output = [{ pattern = 'Success! The configuration is valid', message = 'ok (valid)' }]

[[compactor]]
name = "pulumi-up"
match.argv = ["pulumi", "up", "*"]
strip_ansi = true
strip_lines = [
  '^\s*$', '^Updating \(', '^Previewing update', '^View in Browser', '^View Live:',
  '^Duration:', '^Permalink:', '^\s*Type\s+Name\s+', '^Loading policy packs', '^More information at:', '^Use `pulumi ',
]
on_empty = "pulumi up: no changes"

[[compactor]]
name = "pulumi-preview"
match.argv = ["pulumi", "preview", "*"]
strip_ansi = true
strip_lines = [
  '^\s*$', '^Previewing update', '^View in Browser', '^View Live:', '^Duration:',
  '^Permalink:', '^\s*Type\s+Name\s+', '^Loading policy packs', '^More information at:', '^Use `pulumi ',
]
on_empty = "pulumi preview: no changes"

[[compactor]]
name = "pulumi-destroy"
match.argv = ["pulumi", "destroy", "*"]
strip_ansi = true
strip_lines = [
  '^\s*$', '^Destroying \(', '^View in Browser', '^View Live:', '^Duration:',
  '^Permalink:', '^\s*Type\s+Name\s+', '^More information at:', '^Use `pulumi ',
]
on_empty = "pulumi destroy: nothing to destroy"

[[compactor]]
name = "pulumi-refresh"
match.argv = ["pulumi", "refresh", "*"]
strip_ansi = true
strip_lines = [
  '^\s*$', '^Refreshing \(', '^View in Browser', '^View Live:', '^Duration:',
  '^Permalink:', '^\s*Type\s+Name\s+', '^More information at:', '^Use `pulumi ',
]
