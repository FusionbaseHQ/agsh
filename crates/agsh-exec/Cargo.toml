[package]
name = "agsh-exec"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
authors.workspace = true
description = "Expansion, builtins, process execution, and confinement for agsh."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
publish.workspace = true

[dependencies]
agsh-broker = { path = "../agsh-broker" }
agsh-compat = { path = "../agsh-compat" }
agsh-core = { path = "../agsh-core" }
agsh-index = { path = "../agsh-index" }
agsh-output = { path = "../agsh-output" }
agsh-policy = { version = "0.2.0", path = "../agsh-policy" }
agsh-render = { version = "0.2.0", path = "../agsh-render" }
agsh-store = { version = "0.2.0", path = "../agsh-store" }
agsh-style = { version = "0.2.0", path = "../agsh-style" }
regex = "1.12.4"
rustix = { version = "1.1.4", features = ["process", "termios", "pty", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
signal-hook = "0.4.4"

[lints]
workspace = true
