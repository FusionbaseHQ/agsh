[package]
name = "agsh-render"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
agsh-style = { version = "0.1.0", path = "../agsh-style" }
serde_json = "1"
csv = "1"
base64 = "0.22"
rustix = { version = "1.1.4", features = ["termios"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "tiff",
] }

[lints]
workspace = true
